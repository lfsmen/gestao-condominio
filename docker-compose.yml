services:
  db:
    image: postgres:15-alpine
    container_name: condominio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: condominio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: condominio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/condominio?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/condominio?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-change-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-admin@condominio.app}
      DEV_AUTH_USER: ${DEV_AUTH_USER:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
